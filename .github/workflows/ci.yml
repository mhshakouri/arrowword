name: CI

# Checks only, no deploying. Cloudflare Workers Builds owns deployment, so this
# workflow never holds Cloudflare credentials and Cloudflare never runs checks.
# What makes that safe is branch protection: `checks` is a required status on
# main, so nothing untested reaches the branch Workers Builds deploys from. See
# ADR-11, and the same split on the parent site.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      # Must precede the tests. The assets binding points at ./dist, so
      # `wrangler dev` has nothing to serve until this has run.
      - run: npm run build
      # Three runs: the alignment unit tests, the acceptance suite, then expiry,
      # which needs its own worker with a short retention window. Each worker
      # run starts and stops itself. See docs/SPEC.md section 12.
      - run: npm test
